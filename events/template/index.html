<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Family Celebration Invitation</title>
  
  <!-- WhatsApp & Social Media OpenGraph Tags -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Family Celebration Invitation">
  <meta property="og:description" content="Join us for a wonderful family celebration! Tap to view details and location.">
  <meta property="og:image" content="assets/og_preview.jpg">

  <link rel="stylesheet" href="../../shared/css/common.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container">
    <header class="top-nav">
      <span class="pill-badge">🎉 Celebration</span>
      <button class="mode-toggle-btn trigger-story-reel">📱 Watch Reel</button>
    </header>

    <main>
      <section class="glass-panel hero-card">
        <p class="hero-subtitle">You're Invited</p>
        <h1 class="hero-title pink-gradient-text">Celebrant Name</h1>
        <p class="hero-tagline">Join us as we celebrate together with joy and warmth.</p>
      </section>

      <section class="glass-panel countdown-card">
        <div class="section-label">Moments Until Celebration</div>
        <div class="countdown-grid">
          <div class="countdown-box"><div id="cd-days" class="countdown-val">00</div><div class="countdown-unit">Days</div></div>
          <div class="countdown-box"><div id="cd-hours" class="countdown-val">00</div><div class="countdown-unit">Hours</div></div>
          <div class="countdown-box"><div id="cd-mins" class="countdown-val">00</div><div class="countdown-unit">Mins</div></div>
          <div class="countdown-box"><div id="cd-secs" class="countdown-val">00</div><div class="countdown-unit">Secs</div></div>
        </div>
      </section>

      <section class="glass-panel details-card">
        <div class="details-row">
          <div class="details-icon">🗓️</div>
          <div class="details-content">
            <h3>Date & Day</h3>
            <p>Date goes here</p>
          </div>
        </div>
        <div class="details-row">
          <div class="details-icon">⏰</div>
          <div class="details-content">
            <h3>Time</h3>
            <p>6:00 PM onwards</p>
          </div>
        </div>
        <div class="details-row">
          <div class="details-icon">📍</div>
          <div class="details-content">
            <h3>Venue</h3>
            <p>Party Hall Name</p>
          </div>
        </div>
      </section>

      <section class="action-grid">
        <a href="https://maps.google.com" target="_blank" class="btn-primary-maps">
          <span>📍</span> Open in Google Maps
        </a>
      </section>
    </main>
  </div>

  <script src="../../shared/js/confetti.js"></script>
  <script src="../../shared/js/countdown.js"></script>
  <script src="../../shared/js/calendar.js"></script>
</body>
</html>
